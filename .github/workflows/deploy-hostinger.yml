name: Build Hostinger site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run lint

      - name: Build static site
        run: npm run build

      - name: Publish static files to hostinger branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit --allow-empty -m "build: Hostinger deployment for ${GITHUB_SHA}"
          deploy_commit="$(git subtree split --prefix dist)"
          git push --force origin "${deploy_commit}:refs/heads/hostinger"
